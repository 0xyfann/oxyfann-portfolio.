name: OXYFANN Website Check

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - ".github/workflows/**"

jobs:
  check-website:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Check index.html exists
        run: test -f index.html && echo "OXYFANN website file found!"
