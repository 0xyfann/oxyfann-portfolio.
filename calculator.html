
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>OXYFANN | Neon Calculator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #eef4ff;
      background: radial-gradient(circle at top, #16253c, #080b12 65%);
      font-family: system-ui, sans-serif;
    }

    .app { width: 100%; max-width: 360px; }

    .brand {
      text-align: center;
      color: #55e7ff;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 18px;
    }

    .calculator {
      padding: 20px;
      background: #101622;
      border: 1px solid #26364c;
      border-radius: 24px;
      box-shadow: 0 15px 50px #0008;
    }

    .display {
      min-height: 105px;
      padding: 16px 10px;
      margin-bottom: 16px;
      text-align: right;
      border-radius: 14px;
      background: #080d16;
      overflow: hidden;
    }

    #history {
      min-height: 25px;
      color: #9ba9bf;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #result {
      font-size: clamp(30px, 9vw, 42px);
      font-weight: 700;
      color: #55e7ff;
      overflow-wrap: anywhere;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    button {
      min-width: 0;
      min-height: 58px;
      border: 1px solid #28364b;
      border-radius: 13px;
      background: #192333;
      color: #eef4ff;
      font: inherit;
      font-size: 20px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.96); }

    .operator { color: #55e7ff; background: #142638; }
    .utility { color: #c6b4ff; background: #25203b; }
    .equals {
      background: #55e7ff;
      color: #071017;
      border-color: #55e7ff;
      font-weight: 900;
    }

    .zero { grid-column: span 2; }
    .back {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #9ba9bf;
      text-decoration: none;
    }

    .back:hover { color: #55e7ff; }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand">OXYFANN</div>

    <section class="calculator" aria-label="Kalkulator">
      <div class="display" aria-live="polite">
        <div id="history">NEON CALCULATOR</div>
        <div id="result">0</div>
      </div>

      <div class="keys">
        <button class="utility" data-action="clear">AC</button>
        <button class="utility" data-action="sign">+/−</button>
        <button class="utility" data-action="percent">%</button>
        <button class="operator" data-op="/">÷</button>

        <button data-num="7">7</button>
        <button data-num="8">8</button>
        <button data-num="9">9</button>
        <button class="operator" data-op="*">×</button>

        <button data-num="4">4</button>
        <button data-num="5">5</button>
        <button data-num="6">6</button>
        <button class="operator" data-op="-">−</button>

        <button data-num="1">1</button>
        <button data-num="2">2</button>
        <button data-num="3">3</button>
        <button class="operator" data-op="+">+</button>

        <button class="zero" data-num="0">0</button>
        <button data-action="decimal">.</button>
        <button class="equals" data-action="equals">=</button>
      </div>
    </section>

    <a class="back" href="./">← Kembali ke OXYFANN Portfolio</a>
  </main>

  <script>
    const result = document.getElementById("result");
    const history = document.getElementById("history");

    let current = "0";
    let previous = null;
    let operator = null;
    let startNew = false;

    function render() {
      result.textContent = current;
      history.textContent = previous !== null
        ? `${previous} ${symbol(operator)}`
        : "NEON CALCULATOR";
    }

    function symbol(op) {
      return ({ "+": "+", "-": "−", "*": "×", "/": "÷" })[op] || "";
    }

    function number(value) {
      if (startNew || current === "Error") {
        current = value;
        startNew = false;
      } else if (current === "0") {
        current = value;
      } else if (current.replace("-", "").replace(".", "").length < 14) {
        current += value;
      }
      render();
    }

    function calculate() {
      if (previous === null || operator === null) return;

      const a = Number(previous);
      const b = Number(current);
      let answer;

      if (operator === "+") answer = a + b;
      if (operator === "-") answer = a - b;
      if (operator === "*") answer = a * b;
      if (operator === "/") answer = b === 0 ? NaN : a / b;

      history.textContent = `${previous} ${symbol(operator)} ${current} =`;

      if (!Number.isFinite(answer)) {
        current = "Error";
      } else {
        current = String(Number(answer.toPrecision(12)));
      }

      previous = null;
      operator = null;
      startNew = true;
      result.textContent = current;
    }

    document.querySelector(".keys").addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.num !== undefined) {
        number(button.dataset.num);
        return;
      }

      if (button.dataset.op) {
        if (previous !== null && operator && !startNew) calculate();
        previous = current;
        operator = button.dataset.op;
        startNew = true;
        render();
        return;
      }

      switch (button.dataset.action) {
        case "clear":
          current = "0";
          previous = null;
          operator = null;
          startNew = false;
          render();
          break;

        case "decimal":
          if (startNew || current === "Error") {
            current = "0.";
            startNew = false;
          } else if (!current.includes(".")) {
            current += ".";
          }
          render();
          break;

        case "sign":
          if (current !== "0" && current !== "Error") {
            current = String(-Number(current));
          }
          render();
          break;

        case "percent":
          if (current !== "Error") {
            current = String(Number(current) / 100);
          }
          render();
          break;

        case "equals":
          calculate();
          break;
      }
    });
  </script>
</body>
</html>
